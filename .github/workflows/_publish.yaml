name: _Template Publish

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Full image reference to push (e.g. ghcr.io/owner/repo), tagged :latest and :<sha>'
        required: true
        type: string
      working-directory:
        description: 'Directory containing the Dockerfile to build'
        required: false
        type: string
        default: '.'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          push: true
          tags: |
            ${{ inputs.image-name }}:latest
            ${{ inputs.image-name }}:${{ github.sha }}
